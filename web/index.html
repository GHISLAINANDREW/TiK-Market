<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TiK-Market</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <!-- Apple PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TiK-Market">
  <link rel="apple-touch-icon" sizes="192x192" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23FFFFFF'/%3E%3Ccircle cx='50' cy='28' r='22' stroke='%231B5E20' stroke-width='8' fill='none'/%3E%3Ccircle cx='50' cy='28' r='6' fill='%231B5E20'/%3E%3Cpath d='M20 45H80V85C80 90.5228 75.5228 95 70 95H30C24.4772 95 20 90.5228 20 85V45Z' fill='%231B5E20'/%3E%3Ctext x='50' y='78' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='24' fill='white'%3ETiK%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#FFFFFF">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; position: fixed; background: white; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; }
    #composeApp { width: 100%; height: 100dvh; flex: 1; }
    #splash {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FFFFFF; z-index: 9999; transition: opacity 0.5s ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .tik-logo-svg { width: 120px; height: 120px; }
    .splash-title { font-size: 26px; font-weight: 800; color: #1B5E20; letter-spacing: 1px; margin-top: 15px; }
    .splash-footer { position: absolute; bottom: 50px; text-align: center; }
    .splash-version { font-size: 12px; color: #9E9E9E; margin-bottom: 6px; }
    .splash-footer-brand { font-size: 14px; font-weight: bold; color: #1B5E20; letter-spacing: 3px; }
    #error-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: #FFFFFF; z-index: 10001; color: #1B5E20; text-align: center; padding: 32px;
    }
    #error-screen.visible { display: flex; }
    .err-icon { font-size: 64px; margin-bottom: 20px; }
    button { background: #1B5E20; color: white; border: none; padding: 12px 32px; border-radius: 28px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="composeApp"></div>

  <div id="splash">
    <div class="splash-logo-container">
      <svg class="tik-logo-svg" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="28" r="22" stroke="#1B5E20" stroke-width="8"/>
        <circle cx="50" cy="28" r="6" fill="#1B5E20"/>
        <path d="M20 45H80V85C80 90.5228 75.5228 95 70 95H30C24.4772 95 20 90.5228 20 85V45Z" fill="#1B5E20"/>
        <text x="50" y="78" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="24" fill="white">TiK</text>
      </svg>
      <div class="splash-title">TIK MARKET</div>
    </div>
    <div class="splash-footer">
        <div class="splash-version">Version 2.6 (Stable)</div>
        <div class="splash-footer-brand">TIK MARKET</div>
    </div>
  </div>

  <div id="error-screen">
    <div class="err-icon">⚠️</div>
    <h2>Un instant...</h2>
    <p>L'application met plus de temps que prévu à charger.<br>Vérifiez votre connexion ou essayez un navigateur plus récent.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>

  <script src="composeApp.js"></script>
  <script>
    (function() {
      var splash = document.getElementById('splash');
      var appEl = document.getElementById('composeApp');
      var errorScreen = document.getElementById('error-screen');

      // Detect app rendering
      var observer = new MutationObserver(function() {
        if (appEl.children.length > 0) {
          splash.classList.add('hidden');
          observer.disconnect();
          clearTimeout(failTimer);
        }
      });
      observer.observe(appEl, { childList: true, subtree: true });

      // Increase timeout to 120s for slow networks
      var failTimer = setTimeout(function() {
        if (appEl.children.length === 0) {
          splash.classList.add('hidden');
          errorScreen.classList.add('visible');
        }
      }, 120000);

      // Auto-hide splash on error to see console
      window.addEventListener('error', function() {
          setTimeout(function() {
              if (appEl.children.length === 0) {
                  splash.classList.add('hidden');
                  errorScreen.classList.add('visible');
              }
          }, 5000);
      });
    })();
  </script>
</body>
</html>
