<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>TiK-Market</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#splash,#composeApp{width:100%;height:100%;overflow:hidden}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff}
#splash{position:fixed;top:0;left:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease}
#splash.hidden{opacity:0;pointer-events:none}
.splash-icon{width:100px;height:100px;margin-bottom:20px}
.splash-text{color:#1B5E20;font-size:22px;font-weight:700;margin-bottom:6px}
.splash-sub{color:#666;font-size:13px;margin-bottom:40px}
.splash-spinner{width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#1B5E20;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- SPLASH SCREEN — Facebook style: white bg, icon centered, spinner -->
<div id="splash">
  <svg class="splash-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Bag handle (arc) -->
    <path d="M54,28m-22,0a22,22 0,1,1 44,0a22,22 0,1,1 -44,0" fill="none" stroke="#1B5E20" stroke-width="8"/>
    <!-- Handle dot -->
    <circle cx="54" cy="28" r="6" fill="#1B5E20"/>
    <!-- Bag body -->
    <path d="M24,45h60v40c0,5.5-4.5,10-10,10H34c-5.5,0-10-4.5-10-10z" fill="#1B5E20"/>
    <!-- T -->
    <path d="M42,62h10v3h-4v12h-2v-12h-4z" fill="#fff"/>
    <!-- i -->
    <rect x="55" y="62" width="2" height="2" fill="#fff"/>
    <rect x="55" y="66" width="2" height="11" fill="#fff"/>
    <!-- k -->
    <rect x="61" y="62" width="2" height="15" fill="#fff"/>
    <path d="M63,70l5,-8h2l-5,8l6,7h-2l-5,-6l-1,1v5h-2z" fill="#fff"/>
  </svg>
  <div class="splash-text">TiK-Market</div>
  <div class="splash-sub">La marketplace camerounaise</div>
  <div class="splash-spinner"></div>
</div>

<!-- COMPOSE WASM CONTAINER — id must match viewportContainerId="composeApp" -->
<div id="composeApp"></div>

<script>
// ═══════════════════════════════════════════
// FETCH INTERCEPTOR — proxy Render URLs to /api/
// ═══════════════════════════════════════════
(function(){
  var API=['tik-market.onrender.com','tik-market-proxy.gtankou.workers.dev','tik-market-api.gtankou.workers.dev'];
  var owf=window.fetch;
  window.fetch=function(){
    var url=arguments[0];
    if(typeof url==='string'){
      for(var i=0;i<API.length;i++){
        if(url.indexOf(API[i])!==-1){
          var rest=url.substring(url.indexOf(API[i])+API[i].length);
          if(rest.indexOf('/api/')===0)rest=rest.substring(4);
          if(rest[0]!=='/')rest='/'+rest;
          url='/api'+rest;
          arguments[0]=url;
          break;
        }
      }
    }
    return owf.apply(this,arguments);
  };
})();
// ═══════════════════════════════════════════
// BACK BUTTON — prevent closing web app
// ═══════════════════════════════════════════
(function(){
  history.pushState({},"","#");
  window.addEventListener("popstate",function(e){
    e.preventDefault();
    history.pushState({},"","#");
  });
})();
</script>
<script>
// ═══════════════════════════════════════════
// LOAD COMPOSE APP — with progress tracking
// ═══════════════════════════════════════════
(function(){
  var script=document.createElement('script');
  script.src='composeApp.js?'+Date.now();
  script.onload=function(){console.log('[Splash] composeApp.js loaded')}
  script.onerror=function(){
    console.error('[Splash] Failed to load composeApp.js, retrying...');
    setTimeout(function(){script.src='composeApp.js?'+Date.now()},3000);
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
