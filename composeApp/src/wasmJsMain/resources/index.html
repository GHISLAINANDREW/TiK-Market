<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dschang Market Place</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DschangMarket">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: system-ui, -apple-system, sans-serif; }
    #composeApp { width: 100%; height: 100vh; }
    #splash {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #1B5E20 0%, #2E7D32 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-icon {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .splash-icon svg { width: 44px; height: 44px; }
    .splash-title {
      font-size: 26px; font-weight: 700;
      color: #fff; letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .splash-sub {
      font-size: 13px; color: rgba(255,255,255,0.7);
      margin-bottom: 28px;
    }
    .progress-track {
      width: 180px; height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #FF9800, #FFB74D);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .splash-version {
      position: fixed; bottom: 24px;
      font-size: 11px; color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <div id="composeApp"></div>
  <div id="splash">
    <div class="splash-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M22 21V19C22 17.14 20.73 15.59 19 15.14C17.9 14.86 16.72 14.72 15.5 14.72C14.33 14.72 13.19 14.84 12.1 15.08M10 21H2V19C2 16.79 4.69 15 8 15C9.2 15 10.33 15.2 11.3 15.55M16 7C16 9.21 14.21 11 12 11C9.79 11 8 9.21 8 7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7ZM7 21V19C7 17.14 8.27 15.59 10 15.14C11.1 14.86 12.28 14.72 13.5 14.72C14.67 14.72 15.81 14.84 16.9 15.08C18.1 15.38 19 16.48 19 18V21H7Z" fill="#FF9800"/>
      </svg>
    </div>
    <div class="splash-title">DschangMarket</div>
    <div class="splash-sub">Marché de Dschang en ligne</div>
    <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="splash-version">v1.0.0</div>
  </div>
  <script type="module" src="dschangmarket.mjs"></script>
  <script>
    (function() {
      var bar = document.getElementById('progress-bar');
      var splash = document.getElementById('splash');
      var appEl = document.getElementById('composeApp');
      var hidden = false;

      function hideSplash() {
        if (hidden) return;
        hidden = true;
        bar.style.width = '100%';
        setTimeout(function() { splash.classList.add('hidden'); }, 300);
      }

      // Animated progress bar (logarithmic curve, fast then slow)
      var start = Date.now();
      var maxDuration = 12000;
      (function tick() {
        var elapsed = Date.now() - start;
        var t = Math.min(elapsed / maxDuration, 1);
        var eased = 1 - (1 - t) * (1 - t); // ease-out
        bar.style.width = Math.round(eased * 100) + '%';
        if (t < 1 && !hidden) requestAnimationFrame(tick);
      })();

      // Detect when Compose app actually renders inside #composeApp
      var observer = new MutationObserver(function() {
        if (appEl.children.length > 0 || appEl.textContent.trim() !== '') {
          hideSplash();
          observer.disconnect();
        }
      });
      observer.observe(appEl, { childList: true, subtree: true, characterData: true });

      // Fallback: force-hide after 12s regardless
      setTimeout(hideSplash, maxDuration + 1000);
    })();

    // Register Service Worker immediately (before load)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(function(reg) {
          // If already active, claim immediately
          if (reg.active) {
            navigator.serviceWorker.ready.then(function() {
              // Force activate
              reg.active.postMessage({ type: 'CLAIM' });
            });
          }
        })
        .catch(function() {});
    }
  </script>
</body>
</html>
