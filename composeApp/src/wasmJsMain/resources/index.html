  <!-- Social sharing -->
  <meta property="og:title" content="Dschang Market">
  <meta property="og:description" content="Achetez et vendez des produits locaux au Cameroun">

  <!-- Theme -->
  <meta name="theme-color" content="#1B5E20">
  <!-- Preload critical wasm modules for early loading -->
  <link rel="preload" as="fetch" crossorigin="anonymous" href="dd568dbcd078c0adf7cf.wasm">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="skiko.wasm">
  <link rel="modulepreload" href="dschangmarket.mjs">
  <link rel="modulepreload" href="skiko.mjs">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #1B5E20;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #composeApp { width: 100%; height: 100vh; }
    /* Splash screen */
    #splash {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1B5E20;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-icon {
      width: 72px; height: 72px;
      background: rgba(255,255,255,0.10);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .splash-icon svg { width: 38px; height: 38px; }
    .splash-title {
      font-size: 22px; font-weight: 700;
      color: #fff; letter-spacing: 0.4px;
    }
    .splash-sub {
      font-size: 12px; color: rgba(255,255,255,0.5);
      margin-top: 8px; letter-spacing: 0.2px;
    }
    /* Offline banner */
    #offline-banner {
      position: fixed; top: 0; left: 0; right: 0;
      background: #D32F2F; color: white;
      text-align: center; padding: 6px 16px;
      font-size: 13px; font-weight: 500;
      z-index: 10000;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    #offline-banner.show { transform: translateY(0); }
    /* Scrollbar styling for web */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
    /* Error state if wasm fails to load */
    #error-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1B5E20; z-index: 10001;
      color: white; text-align: center; padding: 32px;
    }
    #error-screen.visible { display: flex; }
    #error-screen .err-icon { font-size: 48px; margin-bottom: 16px; }
    #error-screen h2 { font-size: 18px; margin-bottom: 8px; }
    #error-screen p { font-size: 13px; opacity: 0.8; margin-bottom: 20px; }
    #error-screen button {
      background: #FF9800; color: white; border: none;
      padding: 10px 28px; border-radius: 24px; font-size: 14px;
      cursor: pointer; font-weight: 600;
    }
    #error-screen button:hover { background: #F57C00; }
  </style>
</head>
<body>
  <div id="composeApp"></div>

  <!-- Error screen (shown if wasm loading fails) -->
  <div id="error-screen">
    <div class="err-icon">⚠️</div>
    <h2>Chargement interrompu</h2>
    <p>L'application n'a pas pu se charger complètement.<br>Vérifiez votre connexion et réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>

  <!-- Offline banner -->
  <div id="offline-banner">📡 Connexion perdue — certaines fonctionnalités peuvent être limitées</div>

  <!-- Splash -->
  <div id="splash">
    <div class="splash-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M22 21V19C22 17.14 20.73 15.59 19 15.14C17.9 14.86 16.72 14.72 15.5 14.72C14.33 14.72 13.19 14.84 12.1 15.08M10 21H2V19C2 16.79 4.69 15 8 15C9.2 15 10.33 15.2 11.3 15.55M16 7C16 9.21 14.21 11 12 11C9.79 11 8 9.21 8 7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7ZM7 21V19C7 17.14 8.27 15.59 10 15.14C11.1 14.86 12.28 14.72 13.5 14.72C14.67 14.72 15.81 14.84 16.9 15.08C18.1 15.38 19 16.48 19 18V21H7Z" fill="#FF9800"/>
      </svg>
    </div>
    <div class="splash-title">DschangMarket</div>
    <div class="splash-sub">Marché local en ligne</div>
  </div>

  <script type="module" src="dschangmarket.mjs"></script>
  <script>
    (function() {
      var splash = document.getElementById('splash');
      var appEl = document.getElementById('composeApp');
      var errorScreen = document.getElementById('error-screen');

      // ── Splash ──
      var observer = new MutationObserver(function() {
        if (appEl.children.length > 0) {
          splash.classList.add('hidden');
          observer.disconnect();
          clearTimeout(failTimer);
        }
      });
      observer.observe(appEl, { childList: true, subtree: true });

      // Show error if wasm fails to load after 15s
      var failTimer = setTimeout(function() {
        if (appEl.children.length === 0) {
          splash.classList.add('hidden');
          errorScreen.classList.add('visible');
        }
      }, 15000);

      // Also hide splash on error
      window.addEventListener('error', function() {
        splash.classList.add('hidden');
        clearTimeout(failTimer);
      });

      // ── Offline detection ──
      var banner = document.getElementById('offline-banner');
      function updateOnlineStatus() {
        banner.classList.toggle('show', !navigator.onLine);
      }
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();

      // ── Auto-refresh when tab regains focus ──
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && typeof appStateRefresh === 'function') {
          appStateRefresh();
        }
      });

      // ── PWA Install prompt ──
      var deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        // Show a small install banner if user has been here a while
        setTimeout(function() {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function() {
              deferredPrompt = null;
            });
          }
        }, 60000);
      });

      // ── Service Worker ──
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(function() {});
      }
    })();
  </script>
</body>
</html>
