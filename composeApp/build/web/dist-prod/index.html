<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dschang Market Place</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DschangMarket">
  <meta name="theme-color" content="#1B5E20">
  <!-- Preload critical wasm modules for early loading -->
  <link rel="preload" as="fetch" crossorigin="anonymous" href="dd568dbcd078c0adf7cf.wasm">
  <link rel="preload" as="fetch" crossorigin="anonymous" href="skiko.wasm">
  <link rel="modulepreload" href="dschangmarket.mjs">
  <link rel="modulepreload" href="skiko.mjs">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1B5E20; }
    #composeApp { width: 100%; height: 100vh; }
    #splash {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1B5E20;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-icon {
      width: 72px; height: 72px;
      background: rgba(255,255,255,0.12);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .splash-icon svg { width: 38px; height: 38px; }
    .splash-title {
      font-size: 22px; font-weight: 700;
      color: #fff; letter-spacing: 0.3px;
    }
    /* Download buttons */
    .dl-row { position: fixed; top: 12px; right: 12px; z-index: 10000; display: flex; gap: 6px; }
    .dl-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; padding: 5px 11px;
      border-radius: 14px; background: rgba(255,255,255,0.15);
      color: white; text-decoration: none; cursor: pointer;
      backdrop-filter: blur(4px); white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 0.2s;
    }
    .dl-btn:hover { background: rgba(255,255,255,0.25); }
    .dl-btn.ios { opacity: 0.55; cursor: default; }
  </style>
</head>
<body>
  <div class="dl-row">
    <span class="dl-btn" onclick="document.getElementById('composeApp').scrollIntoView({behavior:'smooth'})" title="Téléchargeable depuis Paramètres">📱 APK</span>
    <span class="dl-btn ios" title="App iOS bientôt disponible">🍎 iOS</span>
  </div>
  <div id="composeApp"></div>
  <div id="splash">
    <div class="splash-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M22 21V19C22 17.14 20.73 15.59 19 15.14C17.9 14.86 16.72 14.72 15.5 14.72C14.33 14.72 13.19 14.84 12.1 15.08M10 21H2V19C2 16.79 4.69 15 8 15C9.2 15 10.33 15.2 11.3 15.55M16 7C16 9.21 14.21 11 12 11C9.79 11 8 9.21 8 7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7ZM7 21V19C7 17.14 8.27 15.59 10 15.14C11.1 14.86 12.28 14.72 13.5 14.72C14.67 14.72 15.81 14.84 16.9 15.08C18.1 15.38 19 16.48 19 18V21H7Z" fill="#FF9800"/>
      </svg>
    </div>
    <div class="splash-title">DschangMarket</div>
  </div>
  <script type="module" src="dschangmarket.mjs"></script>
  <script>
    (function() {
      var splash = document.getElementById('splash');
      var appEl = document.getElementById('composeApp');

      // Hide splash when Compose app renders content
      var observer = new MutationObserver(function() {
        if (appEl.children.length > 0) {
          splash.classList.add('hidden');
          observer.disconnect();
        }
      });
      observer.observe(appEl, { childList: true, subtree: true });

      // Safety fallback
      setTimeout(function() { splash.classList.add('hidden'); }, 30000);
    })();

    // Register Service Worker early for instant 2nd-load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(function() {});
    }
  </script>
</body>
</html>
