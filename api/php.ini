; PHP configuration for Dschang Market API (used by the Render Docker container)
; Photos from modern phones are 3-8 MB and are sent as base64 JSON (+33% overhead),
; so the PHP defaults (post_max_size=8M) silently reject media uploads.

memory_limit = 256M
post_max_size = 25M
upload_max_filesize = 20M
max_execution_time = 120
max_input_time = 120
