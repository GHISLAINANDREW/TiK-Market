# =============================================================================
# TiK-Market — Nginx server blocks for the Oracle Cloud backend
# =============================================================================
# Place this in /etc/nginx/sites-available/tik-market and symlink it:
#   sudo ln -s /etc/nginx/sites-available/tik-market /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# This config uses TWO DuckDNS subdomains:
#   - tik-market.duckdns.org  → PHP backend (HTTPS)
#   - live.tik-market.duckdns.org → LiveKit WSS (HTTPS)
#
# Replace both subdomains with your actual DuckDNS names.
# =============================================================================

# ── Backend: HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name tik-market.duckdns.org live.tik-market.duckdns.org;
    return 301 https://$host$request_uri;
}

# ── Backend: HTTPS (PHP + uploads) ──
server {
    listen 443 ssl;
    server_name tik-market.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/tik-market.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tik-market.duckdns.org/privkey.pem;

    root /var/www/tik-market/api;
    index index.php;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Serve uploaded media (videos, images, audio).
    location /uploads/ {
        alias /var/www/tik-market/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files.
    location ~ /\. {
        deny all;
    }

    # Deny access to config files.
    location ~ ^/config/ {
        deny all;
    }
}

# ── LiveKit reverse proxy (WSS) ──
# LiveKit runs on port 7880. This proxies wss://live.tik-market.duckdns.org to it.
# Requires a Let's Encrypt cert for the live subdomain.
server {
    listen 443 ssl;
    server_name live.tik-market.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/live.tik-market.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.tik-market.duckdns.org/privkey.pem;

    # LiveKit WebSocket
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}