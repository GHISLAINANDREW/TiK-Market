name: Deploy Web (WasmJS) to Vercel
# v1.0.2 - Forcing refresh

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web (WasmJS)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare Distribution
        run: |
          # Ensure the expected directory exists and copy web/ content
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          if [ ! -d "$DIST_DIR" ]; then
            echo "Searching for productionExecutable..."
            DIST_DIR=$(find composeApp/build/dist/wasmJs -name "productionExecutable" -type d | head -n 1)
          fi
          
          if [ -z "$DIST_DIR" ]; then
            echo "Error: Could not find productionExecutable directory"
            exit 1
          fi
          
          echo "Using distribution directory: $DIST_DIR"
          
          if [ -d "web" ]; then
            echo "Copying custom web files..."
            cp -rv web/* "$DIST_DIR/"
          fi
          
          # Copy vercel.json to dist dir to be safe (optional if running from root)
          cp vercel.json "$DIST_DIR/"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
