name: Deploy Web (Max Compatibility) to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'web/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web (Universal JS - Robust)
        run: |
          chmod +x gradlew
          # We use jsBrowserDistribution for max compatibility
          ./gradlew :composeApp:jsBrowserDistribution --no-daemon --stacktrace

      - name: Prepare Distribution
        run: |
          mkdir -p final_deploy
          # Find the JS production folder
          SOURCE_DIR=$(find composeApp/build/dist/js -name "productionExecutable" -type d | head -n 1)
          if [ -z "$SOURCE_DIR" ]; then exit 1; fi
          cp -rv "$SOURCE_DIR"/* final_deploy/
          if [ -d "web" ]; then cp -rv web/* final_deploy/; fi
          cp vercel.json final_deploy/

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel deploy final_deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
