name: Deploy Web (WasmJS) to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'web/**'
      - 'vercel.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web (WasmJS)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Prepare Distribution
        run: |
          # Copy web/ folder content into build output
          # Note: local build path might be slightly different on Ubuntu
          # Let's find the exact path
          DIST_DIR=$(find composeApp/build/dist/wasmJs -name "productionExecutable" -type d | head -n 1)
          if [ -d "web" ]; then
            cp -rv web/* "$DIST_DIR/"
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
