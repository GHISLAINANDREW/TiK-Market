name: Deploy Web (WasmJS) to Vercel
# v1.0.2 - Forcing refresh

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web (WasmJS)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare Distribution
        run: |
          # The standard output dir for Kotlin 2.0.21
          SOURCE_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          
          # Move vercel.json to project root for the action to find it easily
          # No need to copy it into the source dir if we deploy correctly
          
          if [ -d "web" ]; then
            echo "Merging custom web files into production executable..."
            cp -rv web/* "$SOURCE_DIR/"
          fi
          
          echo "Listing distribution files:"
          ls -R "$SOURCE_DIR"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          path: composeApp/build/dist/wasmJs/productionExecutable
