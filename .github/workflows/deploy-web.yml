name: Deploy Web (WasmJS) to Vercel
# v1.0.2 - Forcing refresh

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web (WasmJS)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare Distribution
        run: |
          mkdir -p final_deploy
          SOURCE_DIR=$(find composeApp/build/dist/wasmJs -name "productionExecutable" -type d | head -n 1)
          if [ -z "$SOURCE_DIR" ]; then exit 1; fi
          cp -rv "$SOURCE_DIR"/* final_deploy/
          if [ -d "web" ]; then cp -rv web/* final_deploy/; fi
          cp vercel.json final_deploy/

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel deploy final_deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
