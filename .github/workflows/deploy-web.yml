name: Deploy Web (Compatibility Mode) to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'

      - name: Build Web (Kotlin/JS IR - Max Compatibility)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:jsBrowserDistribution --no-daemon

      - name: Prepare Distribution
        run: |
          mkdir -p final_deploy
          # Find the JS distribution directory
          SOURCE_DIR=$(find composeApp/build/dist/js -name "productionExecutable" -type d | head -n 1)
          if [ -z "$SOURCE_DIR" ]; then 
            echo "Error: JS distribution not found"
            exit 1
          fi
          cp -rv "$SOURCE_DIR"/* final_deploy/
          
          # Apply branding and assets from 'web' folder
          if [ -d "web" ]; then cp -rv web/* final_deploy/; fi
          
          # Use vercel.json for rewrites and headers
          cp vercel.json final_deploy/

      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel deploy final_deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
