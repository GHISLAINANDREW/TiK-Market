name: Deploy Web (WasmJS) to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'web/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web (WasmJS)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Prepare Distribution
        run: |
          DIST_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          # Appliquer les fichiers personnalisés du dossier 'web'
          if [ -d "web" ]; then
            cp -r web/* "$DIST_DIR/"
          fi
          # S'assurer que vercel.json est présent
          if [ -f "vercel.json" ]; then
            cp vercel.json "$DIST_DIR/"
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: composeApp/build/dist/wasmJs/productionExecutable
          vercel-args: '--prod'
