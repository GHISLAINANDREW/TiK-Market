name: Deploy Web (WasmJS) to Vercel
# v1.0.2 - Forcing refresh

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web (WasmJS)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare Distribution
        run: |
          # Create a clean dist folder
          mkdir -p deploy_dist
          
          # Find the compiled Wasm files
          # In Kotlin 2.0.21, it's usually in composeApp/build/dist/wasmJs/productionExecutable
          SOURCE_DIR="composeApp/build/dist/wasmJs/productionExecutable"
          
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Searching for build output..."
            SOURCE_DIR=$(find composeApp/build/dist/wasmJs -name "productionExecutable" -type d | head -n 1)
          fi
          
          echo "Source directory: $SOURCE_DIR"
          ls -R "$SOURCE_DIR"
          
          # Copy everything to deploy_dist
          cp -rv "$SOURCE_DIR"/* deploy_dist/
          
          # Copy custom web files (icons, manifest) if they exist
          if [ -d "web" ]; then
            cp -rv web/* deploy_dist/
          fi
          
          # Copy vercel.json to the deployment folder
          cp vercel.json deploy_dist/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: deploy_dist
          vercel-args: '--prod'
