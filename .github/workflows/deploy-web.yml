name: Deploy Web (WasmJS) to Vercel
# v1.0.2 - Forcing refresh

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web (WasmJS)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare Distribution
        run: |
          # 1. Créer un dossier propre pour le déploiement
          mkdir -p final_deploy
          
          # 2. Identifier le dossier de sortie de Kotlin
          # On cherche dynamiquement pour éviter les erreurs de chemin
          SOURCE_DIR=$(find composeApp/build/dist/wasmJs -name "productionExecutable" -type d | head -n 1)
          
          if [ -z "$SOURCE_DIR" ]; then
            echo "ERREUR : Dossier de compilation introuvable !"
            exit 1
          fi
          
          echo "Copie des fichiers depuis $SOURCE_DIR vers final_deploy"
          
          # 3. Copier le code compilé
          cp -rv "$SOURCE_DIR"/* final_deploy/
          
          # 4. Copier les ressources web (manifest, icons, etc.)
          if [ -d "web" ]; then
            cp -rv web/* final_deploy/
          fi
          
          # 5. Copier la configuration Vercel DANS le dossier de déploiement
          cp vercel.json final_deploy/
          
          echo "Contenu final du dossier de déploiement :"
          ls -F final_deploy

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          path: final_deploy
