name: Deploy Web (WasmJS) to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'api/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Vercel CLI
        run: npm install -g vercel

      - name: Build WasmJS (Web)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsProductionExecutableCompileSync

      - name: Fix import map (js-joda path)
        run: |
          # Copy js-joda.esm.js to root level (outside node_modules)
          cp composeApp/build/web/dist-prod/node_modules/@js-joda/core/js-joda.esm.js composeApp/build/web/dist-prod/js-joda.esm.js
          # Fix import map in index.html (path has wrong dist/ directory)
          sed -i 's|./node_modules/@js-joda/core/dist/js-joda.esm.js|./js-joda.esm.js|g' composeApp/build/web/dist-prod/index.html

      - name: Deploy to Vercel
        run: |
          vercel deploy composeApp/build/web/dist-prod --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
