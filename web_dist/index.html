<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>TiK-Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#splash,#app{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f0f2f5}
#splash{position:fixed;top:0;left:0;z-index:9999;background:linear-gradient(135deg,#1a5e20 0%,#2e7d32 40%,#f9a825 75%,#ff6f00 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease}
#splash.hidden{opacity:0;pointer-events:none}
.splash-logo{width:120px;height:120px;background:#fff;border-radius:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.3);margin-bottom:24px;animation:pulse 1.5s ease-in-out infinite}
.splash-logo svg{width:80px;height:80px}
.splash-title{color:#fff;font-size:32px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.3);margin-bottom:8px}
.splash-sub{color:rgba(255,255,255,.85);font-size:14px;font-weight:400;margin-bottom:32px}
.splash-bar{width:200px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.splash-bar-fill{height:100%;background:#fff;border-radius:2px;animation:load 8s ease-in-out forwards}
.splash-credits{position:absolute;bottom:20px;color:rgba(255,255,255,.5);font-size:11px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes load{0%{width:0}30%{width:60%}70%{width:85%}100%{width:100%}}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#1a5e20"/>
      <path d="M25 70V30l25 20-25 20z" fill="#f9a825"/>
      <path d="M50 70V30l25 20-25 20z" fill="#fff" opacity=".7"/>
      <circle cx="62" cy="50" r="18" fill="#ff6f00" opacity=".9"/>
      <text x="50" y="56" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">T</text>
    </svg>
  </div>
  <div class="splash-title">TiK-Market</div>
  <div class="splash-sub">La marketplace camerounaise</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  <div class="splash-credits">Dschang &bull; Bafoussam &bull; Douala &bull; Yaound&eacute;</div>
</div>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════
// FETCH INTERCEPTOR — proxy Render URLs
// ═══════════════════════════════════════════
(function(){
  var API = ['tik-market.onrender.com','tik-market-proxy.gtankou.workers.dev','tik-market-api.gtankou.workers.dev'];
  var owf = window.fetch;
  window.fetch = function(){
    var url = arguments[0];
    if(typeof url === 'string'){
      for(var i=0;i<API.length;i++){
        if(url.indexOf(API[i])!==-1){
          var rest = url.substring(url.indexOf(API[i])+API[i].length);
          if(rest.indexOf('/api/')===0) rest=rest.substring(4);
          if(rest[0]!=='/') rest='/'+rest;
          url='/api'+rest;
          arguments[0]=url;
          break;
        }
      }
    }
    return owf.apply(this,arguments);
  };
})();
// ═══════════════════════════════════════════
// BACK BUTTON — prevent closing app
// ═══════════════════════════════════════════
(function(){
  history.pushState({},"","#");
  window.addEventListener("popstate",function(e){
    e.preventDefault();
    history.pushState({},"","#");
  });
})();
</script>
<script>
// Hide splash when WASM loads or after 15s safety timeout
(function(){
  function hide(){var s=document.getElementById('splash');if(s)s.classList.add('hidden')}
  setTimeout(hide,15000);
  window.addEventListener('load',function(){setTimeout(hide,500)});
})();
</script>
<script>
var ver = 'v'+Date.now();
var s = document.createElement('script');
s.src='composeApp.js?'+ver;
s.onerror=function(){setTimeout(function(){s.src='composeApp.js?'+ver},3000)};
document.head.appendChild(s);
</script>
</body>
</html>
